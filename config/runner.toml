[hours]
timezone   = "Europe/Rome"
quiet_from = "08:00"
quiet_to   = "19:00"
# Weekends run continuously (no daytime quiet): active from Fri 19:00 to Mon 08:00.
# Format "day HH:MM". Set both to "" to disable and use only quiet_from/quiet_to daily.
weekend_from = "fri 19:00"
weekend_to   = "mon 08:00"

[pace]
max_concurrency = 3
per_project_timeout_min = 30
opus_escalation = true
weekly_reserve_enabled = false
weekly_reserve_frac = 0.12
weekly_target_usd = 0.0
# Live weekly-usage guard (reads the statusline 7d %). Keeps a reserve for your own daytime
# work and throttles the daemon's daily draw. Needs a fresh 7d % to gate overnight builds.
weekly_guard_enabled = true
weekly_ceiling_pct = 50.0   # pause when weekly usage reaches this % (reserve the rest for you)
daily_cap_pct = 10.0        # add at most this many weekly-% points per calendar day

[build]
stack = "typescript"
default_model = "sonnet"

[notify]
telegram_script = "~/.claude/notify-telegram.sh"
notify_on = ["done", "needs-review", "paused", "crash"]
