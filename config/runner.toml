[hours]
timezone   = "Europe/Rome"
quiet_from = "08:00"
quiet_to   = "19:00"
# Weekends run continuously (no daytime quiet): active from Fri 19:00 to Mon 08:00.
# Format "day HH:MM". Set both to "" to disable and use only quiet_from/quiet_to daily.
weekend_from = "fri 19:00"
weekend_to   = "mon 08:00"

[pace]
# First real run (2026-07-24): 3 concurrent Opus builds all blew past a 30-min cap mid-build
# (2000-3600 files each). Give each build far more headroom and run fewer at once.
max_concurrency = 2
# The quality lane installs a repo's toolchain and runs its whole suite inside the worktree,
# which is slower than writing docs: 120 was enough for autodoc, not for this.
per_project_timeout_min = 180
opus_escalation = true
weekly_reserve_enabled = false
weekly_reserve_frac = 0.12
weekly_target_usd = 0.0
# Live weekly-usage guard (reads the statusline 7d %). Keeps a reserve for your own daytime
# work and throttles the daemon's daily draw. Needs a fresh 7d % to gate overnight builds.
weekly_guard_enabled = true
weekly_ceiling_pct = 50.0   # back to the standing value 2026-09-22; the 75.0 of 2026-09-17 was for one night
daily_cap_pct = 10.0        # add at most this many weekly-% points per calendar day
# Use-it-or-lose-it: within this many hours of the weekly reset the reserve would just expire,
# so spend it — ceiling + daily cap suspended (quiet hours and the 5h limit still apply). 0 = off.
burst_before_reset_h = 24.0

[build]
stack = "typescript"
default_model = "sonnet"

[notify]
telegram_script = "~/.claude/notify-telegram.sh"
notify_on = ["done", "needs-review", "paused", "crash"]
